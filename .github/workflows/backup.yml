name: Garden Production backup

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PRODUCTION_SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
      PRODUCTION_R2_ENDPOINT: ${{ secrets.PRODUCTION_R2_ENDPOINT }}
      PRODUCTION_R2_BUCKET: ${{ vars.PRODUCTION_R2_BUCKET }}
      PRODUCTION_R2_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_R2_ACCESS_KEY_ID }}
      PRODUCTION_R2_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_R2_SECRET_ACCESS_KEY }}
      BACKUP_R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
      BACKUP_R2_BUCKET: ${{ vars.BACKUP_R2_BUCKET }}
      BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Install backup tools
        run: sudo apt-get update && sudo apt-get install -y rclone jq
      - name: Validate destinations and create independent snapshot
        shell: bash
        run: |
          set -euo pipefail
          set +x

          test -n "$PRODUCTION_SUPABASE_DB_URL"
          case "$PRODUCTION_SUPABASE_DB_URL" in
            *fnhggqqnkhkrfwmnsqmy*) ;;
            *) echo 'Refusing database backup: source is not the canonical Production project.'; exit 1 ;;
          esac
          case "$PRODUCTION_SUPABASE_DB_URL" in
            *sabulxbfdimoqnbgnmso*) echo 'Refusing database backup: source points to OLD.'; exit 1 ;;
          esac
          test "$PRODUCTION_R2_BUCKET" = 'garden-x-production-media'
          test "$BACKUP_R2_BUCKET" = 'streex-garden-backups'
          for value in \
            "$PRODUCTION_R2_ENDPOINT" "$PRODUCTION_R2_ACCESS_KEY_ID" \
            "$PRODUCTION_R2_SECRET_ACCESS_KEY" "$BACKUP_R2_ENDPOINT" \
            "$BACKUP_R2_ACCESS_KEY_ID" "$BACKUP_R2_SECRET_ACCESS_KEY"; do
            test -n "$value"
          done

          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)-${GITHUB_RUN_ID}"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          cat > "$workdir/rclone.conf" <<EOF
          [production]
          type = s3
          provider = Cloudflare
          access_key_id = $PRODUCTION_R2_ACCESS_KEY_ID
          secret_access_key = $PRODUCTION_R2_SECRET_ACCESS_KEY
          endpoint = $PRODUCTION_R2_ENDPOINT
          region = auto
          no_check_bucket = true
          [backup]
          type = s3
          provider = Cloudflare
          access_key_id = $BACKUP_R2_ACCESS_KEY_ID
          secret_access_key = $BACKUP_R2_SECRET_ACCESS_KEY
          endpoint = $BACKUP_R2_ENDPOINT
          region = auto
          no_check_bucket = true
          EOF
          chmod 600 "$workdir/rclone.conf"
          export RCLONE_CONFIG="$workdir/rclone.conf"
          python3 "$GITHUB_WORKSPACE/scripts/write-libpq-service.py" production "$workdir/pg_service.conf" PRODUCTION_SUPABASE_DB_URL
          cp "$GITHUB_WORKSPACE/scripts/garden-backup-fingerprint.sh" "$workdir/fingerprint.sh"

          # A short read verifies the production token and bucket before the dump.
          rclone lsf "production:$PRODUCTION_R2_BUCKET" --files-only --max-depth 1 >/dev/null
          docker run --rm --network host \
            -v "$workdir:/backup" \
            -e PGSERVICEFILE=/backup/pg_service.conf \
            -e PGSERVICE=production \
            postgres:17 \
            pg_dump service=production --format=custom --no-owner --no-privileges --file=/backup/database.dump
          test -s "$workdir/database.dump"
          docker run --rm --network host \
            -v "$workdir:/backup" \
            -e PGSERVICEFILE=/backup/pg_service.conf \
            -e PGSERVICE=production \
            postgres:17 \
            psql service=production --no-align --tuples-only --set ON_ERROR_STOP=1 \
              --command "select json_build_object('gardens',(select count(*) from garden.gardens),'photos',(select count(*) from garden.photos),'auth_users',(select count(*) from auth.users));" \
              > "$workdir/domain-counts.json"
          docker run --rm --network host \
            -v "$workdir:/backup" \
            -e PGSERVICEFILE=/backup/pg_service.conf \
            -e PGSERVICE=production \
            postgres:17 bash /backup/fingerprint.sh production /backup/pg_service.conf /backup/domain-tables.tsv
          jq -Rn '[inputs | split("\t") | {table:.[0], rows:(.[1]|tonumber), sha256:.[2]}]' \
            < "$workdir/domain-tables.tsv" > "$workdir/domain-tables.json"
          docker run --rm --network host -v "$workdir:/backup" postgres:17 \
            pg_restore --list /backup/database.dump > "$workdir/database.toc"
          test -s "$workdir/database.toc"
          sha256sum "$workdir/database.dump" | awk '{print $1}' > "$workdir/database.dump.sha256"

          # Snapshot paths are unique per run; copy never removes source objects.
          rclone lsjson --recursive --metadata "production:$PRODUCTION_R2_BUCKET" > "$workdir/media-objects.json"
          object_count="$(jq '[.[] | select(.IsDir != true)] | length' "$workdir/media-objects.json")"
          rclone copy --metadata --immutable \
            "production:$PRODUCTION_R2_BUCKET" \
            "backup:$BACKUP_R2_BUCKET/snapshots/$stamp/media"
          rclone check --download --one-way \
            "production:$PRODUCTION_R2_BUCKET" \
            "backup:$BACKUP_R2_BUCKET/snapshots/$stamp/media"

          jq -n \
            --arg snapshot "$stamp" \
            --arg project_ref 'fnhggqqnkhkrfwmnsqmy' \
            --arg source_bucket "$PRODUCTION_R2_BUCKET" \
            --arg database_sha256 "$(cat "$workdir/database.dump.sha256")" \
            --argjson media_objects "$object_count" \
            --slurpfile domain_counts "$workdir/domain-counts.json" \
            --slurpfile domain_tables "$workdir/domain-tables.json" \
            --slurpfile media "$workdir/media-objects.json" \
            '{snapshot:$snapshot, source_project_ref:$project_ref, source_media_bucket:$source_bucket, database_dump_sha256:$database_sha256, domain_counts:$domain_counts[0], domain_tables:$domain_tables[0], media_object_count:$media_objects, media_objects:[$media[0][] | select(.IsDir != true)]}' \
            > "$workdir/backup-manifest.json"

          prefix="backup:$BACKUP_R2_BUCKET/snapshots/$stamp"
          rclone copyto "$workdir/database.dump" "$prefix/database.dump"
          rclone copyto "$workdir/database.dump.sha256" "$prefix/database.dump.sha256"
          rclone copyto "$workdir/backup-manifest.json" "$prefix/backup-manifest.json"
          rclone check --download --one-way "$workdir/database.dump" "$prefix"
          rclone check --download --one-way "$workdir/backup-manifest.json" "$prefix"
