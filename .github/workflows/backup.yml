name: Garden backup

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
      SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY }}
      SUPABASE_STORAGE_S3_ENDPOINT: ${{ secrets.SUPABASE_STORAGE_S3_ENDPOINT }}
      SUPABASE_STORAGE_S3_REGION: ${{ secrets.SUPABASE_STORAGE_S3_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v5
      - name: Install backup tools
        run: sudo apt-get update && sudo apt-get install -y rclone
      - name: Create database, storage and manifest snapshot
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%F)"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          cat > "$workdir/rclone.conf" <<EOF
          [supabase]
          type = s3
          provider = Other
          access_key_id = $SUPABASE_STORAGE_S3_ACCESS_KEY_ID
          secret_access_key = $SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY
          endpoint = $SUPABASE_STORAGE_S3_ENDPOINT
          region = $SUPABASE_STORAGE_S3_REGION
          force_path_style = true
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = $R2_ENDPOINT
          region = auto
          acl = private
          no_check_bucket = true
          EOF
          export RCLONE_CONFIG="$workdir/rclone.conf"
          docker run --rm --network host \
            -v "$workdir:/backup" \
            postgres:17 \
            pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges --file=/backup/database.dump
          rclone copy "$workdir/database.dump" "r2:streex-garden-backups/database/$stamp/"
          rclone copy "supabase:garden-originals" "r2:streex-garden-backups/storage/$stamp/garden-originals"
          rclone lsjson --recursive "supabase:garden-originals" > "$workdir/storage-manifest.json"
          rclone copy "$workdir/storage-manifest.json" "r2:streex-garden-backups/manifests/$stamp/"
          rclone lsf "r2:streex-garden-backups/database/$stamp" --files-only | grep -qx 'database.dump'
          rclone lsf "r2:streex-garden-backups/manifests/$stamp" --files-only | grep -qx 'storage-manifest.json'
