name: Garden X V1 QA
on:
  push:
    branches: [garden-x/v1-migration-current]
  pull_request:
concurrency:
  group: garden-x-v1-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  golden-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Gardenpedia workspace dependencies
        run: npm install --prefix apps/garden-x --no-audit --no-fund
      - name: Typecheck Calculator integration
        run: npx tsc --project apps/garden-x/tsconfig.calculator.json --noEmit --pretty false
      - name: Build Gardenpedia application
        run: npm run build --prefix apps/garden-x
