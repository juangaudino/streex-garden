name: Garden restore drill

on:
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: 'Snapshot UTC to restore (YYYY-MM-DD)'
        required: true
        default: '2026-09-08'
        type: string
      confirmation:
        description: 'Type RESTORE-YYYY-MM-DD to confirm the isolated drill'
        required: true
        type: string

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
      CONFIRMATION: ${{ inputs.confirmation }}
      RESTORE_TARGET_SUPABASE_DB_URL: ${{ secrets.RESTORE_TARGET_SUPABASE_DB_URL }}
      RESTORE_TARGET_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.RESTORE_TARGET_STORAGE_S3_ACCESS_KEY_ID }}
      RESTORE_TARGET_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.RESTORE_TARGET_STORAGE_S3_SECRET_ACCESS_KEY }}
      RESTORE_TARGET_STORAGE_S3_ENDPOINT: ${{ secrets.RESTORE_TARGET_STORAGE_S3_ENDPOINT }}
      RESTORE_TARGET_STORAGE_S3_REGION: ${{ secrets.RESTORE_TARGET_STORAGE_S3_REGION }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v5
      - name: Install restore tools
        run: sudo apt-get update && sudo apt-get install -y jq rclone
      - name: Restore isolated snapshot and verify it
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RESTORE-$SNAPSHOT_DATE"
          test -n "$RESTORE_TARGET_SUPABASE_DB_URL"
          case "$RESTORE_TARGET_SUPABASE_DB_URL" in
            *sabulxbfdimoqnbgnmso*) echo 'Refusing to restore into the production project.'; exit 1 ;;
          esac

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          cat > "$workdir/rclone.conf" <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = $R2_ENDPOINT
          region = auto
          acl = private
          no_check_bucket = true
          [restore]
          type = s3
          provider = Other
          access_key_id = $RESTORE_TARGET_STORAGE_S3_ACCESS_KEY_ID
          secret_access_key = $RESTORE_TARGET_STORAGE_S3_SECRET_ACCESS_KEY
          endpoint = $RESTORE_TARGET_STORAGE_S3_ENDPOINT
          region = $RESTORE_TARGET_STORAGE_S3_REGION
          force_path_style = true
          EOF
          export RCLONE_CONFIG="$workdir/rclone.conf"

          rclone copy "r2:streex-garden-backups/database/$SNAPSHOT_DATE" "$workdir/database"
          rclone copy "r2:streex-garden-backups/manifests/$SNAPSHOT_DATE" "$workdir/manifest"
          test -s "$workdir/database/database.dump"
          test -s "$workdir/manifest/storage-manifest.json"

          docker run --rm --network host \
            -v "$workdir:/restore" \
            postgres:17 \
            sh -ec "pg_restore --list /restore/database/database.dump | grep -v 'EVENT TRIGGER' > /restore/restore.list && pg_restore --use-list=/restore/restore.list --dbname \"$RESTORE_TARGET_SUPABASE_DB_URL\" --clean --if-exists --no-owner --no-privileges --exit-on-error /restore/database/database.dump"

          rclone mkdir "restore:garden-originals"
          rclone copy "r2:streex-garden-backups/storage/$SNAPSHOT_DATE/garden-originals" "restore:garden-originals"
          rclone lsjson --recursive "restore:garden-originals" > "$workdir/restored-storage-manifest.json"

          jq -S '[.[] | {Path, Size}] | sort_by(.Path)' "$workdir/manifest/storage-manifest.json" > "$workdir/source-files.json"
          jq -S '[.[] | {Path, Size}] | sort_by(.Path)' "$workdir/restored-storage-manifest.json" > "$workdir/restored-files.json"
          diff -u "$workdir/source-files.json" "$workdir/restored-files.json"

          docker run --rm --network host postgres:17 \
            psql "$RESTORE_TARGET_SUPABASE_DB_URL" --no-align --tuples-only --set ON_ERROR_STOP=1 \
              --command "select 'gardens=' || count(*) from garden.gardens union all select 'photos=' || count(*) from garden.photos union all select 'storage_objects=' || count(*) from storage.objects where bucket_id = 'garden-originals';"
