name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Garden X workspace dependencies for the shared test suite
        run: npm install --prefix apps/garden-x --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build
